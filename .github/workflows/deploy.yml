name: Deploy React App to EC2

on:
  push:
    branches:
      - chat-app-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Check out code
        uses: actions/checkout@v2

      # Step 2: Set up SSH key and known_hosts
      - name: Set up SSH key and known_hosts
        run: |
          # Create the SSH directory with proper permissions
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write the private key using printf to preserve formatting
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Remove any existing known_hosts file, create a new one, and set permissions
          rm -f ~/.ssh/known_hosts
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Add the remote host to known_hosts to avoid interactive prompts
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}

      # Step 3: Archive the application (for example, using git archive)
      - name: Archive application excluding .git
        run: |
          git archive --format=tar.gz --output=app.tar.gz HEAD

      # Step 4: Copy the archive to the EC2 instance
      - name: Copy application archive to EC2
        run: |
          # Ensure the remote directory exists
          ssh -i ~/.ssh/id_rsa ${{ secrets.USER }}@${{ secrets.HOST }} "mkdir -p /home/${{ secrets.USER }}/react-app"
          # Copy the archive using SCP
          scp -i ~/.ssh/id_rsa app.tar.gz ${{ secrets.USER }}@${{ secrets.HOST }}:/home/${{ secrets.USER }}/react-app/
        env:
          USER: ${{ secrets.USER }}
          HOST: ${{ secrets.HOST }}

      # Step 5: Deploy on EC2: extract the archive and start/restart the app using PM2
      - name: Deploy on EC2
        run: |
          ssh -t -i ~/.ssh/id_rsa ${{ secrets.USER }}@${{ secrets.HOST }} << 'EOF'
            # Explicitly load nvm (if using nvm)
            export NVM_DIR="$HOME/.nvm" 
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd /home/${USER}/react-app
            tar -xzf app.tar.gz
            rm app.tar.gz

            # Install dependencies (adjust as needed for your React/Vite app)
            npm install --legacy-peer-deps

            # Build the Vite app (if required)
            npm run build

            # Restart PM2 process if it exists, otherwise start it.
            # For example, here we use "npm run preview" to serve the app.
            pm2 restart reactapp || pm2 start npm --name reactapp -- run preview
            exit
          EOF
        env:
          USER: ${{ secrets.USER }}

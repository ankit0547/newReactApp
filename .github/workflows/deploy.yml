name: Deploy React Vite App to EC2

on:
  push:
    branches:
      - chat-app-frontend" # Change to your deployment branch, e.g., "chat-app-frontend"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code from the repository
      - name: Check out code
        uses: actions/checkout@v2

      # Step 2: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 3: Build the Vite app (default output is in the 'dist' folder)
      - name: Build Vite App
        run: npm run build

      # Step 4: Archive the build output (using tar to create a compressed archive)
      - name: Archive build output
        run: tar -czf build.tar.gz -C dist .

      # Step 5: Set up SSH key and known_hosts for secure connection
      - name: Set up SSH key and known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/private_key.pem
          chmod 600 ~/.ssh/private_key.pem
          # Add the remote host to known_hosts to prevent SSH authenticity prompts
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}

      # Step 6: Ensure remote target directory exists and copy the build archive
      - name: Copy build archive to EC2
        run: |
          # Create the remote directory if it does not exist
          ssh -i ~/.ssh/private_key.pem ${{ secrets.USER }}@${{ secrets.HOST }} "mkdir -p /home/${{ secrets.USER }}/react-app"
          # Copy the build archive to the remote directory
          scp -i ~/.ssh/private_key.pem build.tar.gz ${{ secrets.USER }}@${{ secrets.HOST }}:/home/${{ secrets.USER }}/react-app/
        env:
          USER: ${{ secrets.USER }}
          HOST: ${{ secrets.HOST }}

      # Step 7: Deploy on EC2: extract the archive and restart the app using PM2
      - name: Deploy on EC2
        run: |
          ssh -t -i ~/.ssh/private_key.pem ${{ secrets.USER }}@${{ secrets.HOST }} << 'EOF'
            cd /home/${USER}/react-app
            # Extract the build archive (this places the built files in the current directory)
            tar -xzf build.tar.gz
            # Optionally remove the archive after extraction
            rm build.tar.gz
            # Restart the PM2 process if it exists, or start a new one
            # In this example, we use "serve" to serve static files from the extracted folder.
            # Ensure that "serve" is installed globally or as a dependency in your project.
            pm2 restart react-app || pm2 start npx --name react-app -- serve -s .
            exit
          EOF
        env:
          USER: ${{ secrets.USER }}

name: Deploy React App to EC2

on:
  push:
    branches:
      - chat-app-frontend

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v2

      - name: Set up SSH key and known_hosts
        run: |
          # Create the SSH directory with proper permissions
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Write the private key to a file and secure it
          echo "$SSH_PRIVATE_KEY" > private_key.pem
          chmod 600 private_key.pem

          # Remove any existing known_hosts file, create a new one, and set proper permissions
          rm -f ~/.ssh/known_hosts
          touch ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          # Fetch and add the host's SSH key to known_hosts securely
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HOST }}

      - name: Copy application archive to EC2
        run: |
          scp -i private_key.pem app.tar.gz ${{ secrets.USER }}@${{ secrets.HOST }}:/home/ubuntu/react-app/

      - name: Deploy on EC2
        run: |
          ssh -t -i private_key.pem ${{ secrets.USER }}@${{ secrets.HOST }} << 'EOF'
            # Explicitly load nvm (if using nvm)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            # Navigate to the app directory and extract the archive
            cd /home/ubuntu/react-app
            tar -xzf app.tar.gz

            # Install dependencies
            npm install --legacy-peer-deps

            # Build the Vite app (adjust this if your build script is different)
            npm run build

            # Restart PM2 process if it exists, or start the preview server using Vite
            pm2 restart reactapp || pm2 start npm --name reactapp -- run preview
            exit
          EOF
